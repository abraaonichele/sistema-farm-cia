<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Redefinir senha publicadora</title>
    <link rel="stylesheet" href="/reset-password.css" />
  </head>
  <body>
    <main class="reset-shell">
      <span class="reset-mark" aria-hidden="true">+</span>
      <h1>Senha da conta publicadora</h1>
      <p id="recovery-intro" aria-live="polite">Validando o link seguro do Supabase…</p>

      <form id="recovery-form" class="hidden" autocomplete="off">
        <label for="recovery-password">Nova senha Supabase</label>
        <input
          id="recovery-password"
          type="password"
          minlength="16"
          maxlength="128"
          autocomplete="new-password"
          required
        />

        <label for="recovery-password-confirmation">Confirmar nova senha</label>
        <input
          id="recovery-password-confirmation"
          type="password"
          minlength="16"
          maxlength="128"
          autocomplete="new-password"
          required
        />

        <label class="show-password">
          <input id="recovery-show-password" type="checkbox" />
          Mostrar senha
        </label>

        <p class="password-guidance">
          Use pelo menos 16 caracteres e uma senha exclusiva. Esta senha não altera a senha do Gmail.
        </p>
        <p id="recovery-status" class="status" role="status" aria-live="assertive"></p>
        <button id="recovery-submit" type="submit">Alterar e validar senha</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/supabase-config.js"></script>
    <script src="/reset-password.js"></script>
  </body>
</html>
