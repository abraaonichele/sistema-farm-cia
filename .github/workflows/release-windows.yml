name: Build and publish Windows update

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set a unique release version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const packagePath = "package.json";
          const lockPath = "package-lock.json";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
          const parts = pkg.version.split(".").map(Number);
          if (parts.length !== 3 || parts.some((part) => !Number.isInteger(part))) {
            throw new Error(`Invalid base package version: ${pkg.version}`);
          }
          const version = `${parts[0]}.${parts[1]}.${parts[2] + Number(process.env.GITHUB_RUN_NUMBER)}`;
          pkg.version = version;
          lock.version = version;
          if (lock.packages?.[""]) lock.packages[""].version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          fs.writeFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`, { flag: "a" });
          NODE

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish installer and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Atendimento Inj Farmacia v${{ steps.version.outputs.version }}
          body: Atualização automática do aplicativo para Windows.
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
