name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            folder: Macos
          - os: windows-latest
            platform: win
            folder: windows
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - Validate GH_TOKEN
        shell: bash
        run: |
          echo "=== GH_TOKEN Validation ==="
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ GH_TOKEN is EMPTY or not set!"
            exit 1
          fi
          echo "GH_TOKEN length: ${#GH_TOKEN}"
          echo "GH_TOKEN prefix: ${GH_TOKEN:0:4}..."
          # Test token with GitHub API
          echo "Testing token with GitHub API..."
          curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/user | jq -r '.login // "FAILED"'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish ${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: 'electron-builder,builder-util-runtime'
        run: npm run build:installers:publish

      - name: Verify release artifacts
        if: success()
        run: |
          echo "=== Build completed for ${{ matrix.platform }} ==="
          ls -la instaladores/${{ matrix.folder }}/
          echo "=== Checking for .yml files ==="
          find instaladores/${{ matrix.folder }}/ -name "*.yml" -o -name "*.yaml" | head -20

      - name: Verify release on GitHub
        if: success() && matrix.platform == 'mac'
        run: |
          echo "=== Checking GitHub releases ==="
          gh release list --repo ${{ github.repository }} --limit 5
          echo "=== Latest release info ==="
          gh release view --repo ${{ github.repository }} --json tagName,name,assets --jq '. | {tag: .tagName, assets: .assets[].name}'